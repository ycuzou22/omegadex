name: Conventions de PR

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [main, dev, dev-frontend, dev-backend]

permissions:
  contents: read

jobs:
  conventions:
    name: conventions
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier branche source, branche cible et titre
        env:
          TITLE: ${{ github.event.pull_request.title }}
          HEAD: ${{ github.event.pull_request.head.ref }}
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          fail=0
          err() { echo "::error::$1"; fail=1; }
          matches() { printf '%s' "$1" | grep -Eq "$2"; }

          case "$BASE" in
            main)
              [ "$HEAD" = "dev" ] || err "Seule la branche dev peut être fusionnée dans main (reçu : $HEAD)."
              matches "$TITLE" '^\[RELEASE\] v[0-9]+\.[0-9]+\.[0-9]+$' || err "Titre attendu pour une release : « [RELEASE] vX.Y.Z »."
              ;;
            dev)
              case "$HEAD" in
                dev-frontend|dev-backend) ;;
                *) err "Seules dev-frontend et dev-backend peuvent être fusionnées dans dev (reçu : $HEAD)." ;;
              esac
              [ "$TITLE" = "[MERGE] $HEAD vers dev" ] || err "Titre attendu : « [MERGE] $HEAD vers dev »."
              ;;
            dev-frontend|dev-backend)
              if [ "$HEAD" = "dev" ]; then
                [ "$TITLE" = "[MERGE] dev vers $BASE" ] || err "Titre attendu pour une remise à jour : « [MERGE] dev vers $BASE »."
              else
                matches "$HEAD" '^(feature|fix|docs|test|refactor|chore|ci)/[0-9]+-[a-z0-9]+(-[a-z0-9]+)*$' \
                  || err "Nom de branche invalide : « $HEAD ». Format attendu : <type>/<numéro-issue>-<description> (voir CONTRIBUTING.md)."
                matches "$TITLE" '^\[(ADD|UPDATE|FIX|DEL|REFACTO|STYLE|TEST|DOCS|CONFIG|CI)\] .+ \(#[0-9]+\)$' \
                  || err "Titre invalide : « $TITLE ». Format attendu : [TAG] description (#numéro-issue)."
              fi
              ;;
          esac

          [ "${#TITLE}" -le 100 ] || err "Le titre dépasse 100 caractères."
          exit $fail
