name: Conventions de PR

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [main, dev]

permissions:
  contents: read

jobs:
  conventions:
    name: conventions
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier branche source, branche cible et titre
        env:
          TITLE: ${{ github.event.pull_request.title }}
          HEAD: ${{ github.event.pull_request.head.ref }}
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          fail=0
          if [ "$BASE" = "main" ]; then
            if [ "$HEAD" != "dev" ]; then
              echo "::error::Seule la branche dev peut être fusionnée dans main (branche reçue : $HEAD)."
              fail=1
            fi
            if ! printf '%s' "$TITLE" | grep -Eq '^\[RELEASE\] v[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::Le titre d'une release doit être « [RELEASE] vX.Y.Z »."
              fail=1
            fi
          else
            if ! printf '%s' "$HEAD" | grep -Eq '^(feature|fix|docs|test|refactor|chore|ci)/[0-9]+-[a-z0-9]+(-[a-z0-9]+)*$'; then
              echo "::error::Nom de branche invalide : « $HEAD ». Format attendu : <type>/<numéro-issue>-<description> (voir CONTRIBUTING.md)."
              fail=1
            fi
            if ! printf '%s' "$TITLE" | grep -Eq '^\[(ADD|UPDATE|FIX|DEL|REFACTO|STYLE|TEST|DOCS|CONFIG|CI)\] .+ \(#[0-9]+\)$'; then
              echo "::error::Titre invalide : « $TITLE ». Format attendu : [TAG] description (#numéro-issue) (voir CONTRIBUTING.md)."
              fail=1
            fi
          fi
          if [ "${#TITLE}" -gt 100 ]; then
            echo "::error::Le titre dépasse 100 caractères."
            fail=1
          fi
          exit $fail
