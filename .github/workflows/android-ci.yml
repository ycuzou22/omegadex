name: Android CI

on:
  pull_request:
    branches: [main, dev, dev-frontend, dev-backend]
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle (avec cache)
        uses: gradle/actions/setup-gradle@v5

      - name: Build, lint et tests
        run: ./gradlew build lint ktlintCheck detekt test createDebugUnitTestCoverageReport --continue 2>&1 | tee gradle.log; exit ${PIPESTATUS[0]}
        shell: bash

      - name: DIAG temporaire
        if: failure()
        run: |
          grep -E "^e: |AnimationEvolution|EquipeScreen|What went wrong|> Task .*FAILED" gradle.log | head -40 | while IFS= read -r l; do echo "::error::${l:0:900}"; done
          find app/build/reports -name "*.txt" -path "*ktlint*" -exec cat {} \; | head -20 | while IFS= read -r l; do echo "::error::KT ${l:0:900}"; done
          find app/build/reports -name "*.txt" -path "*detekt*" -exec cat {} \; | head -20 | while IFS= read -r l; do echo "::error::DT ${l:0:900}"; done
          find app/build -name "lint-results*.txt" -exec grep -E "Error|error" {} \; | head -10 | while IFS= read -r l; do echo "::error::LINT ${l:0:900}"; done

      - name: Couverture du domaine
        run: python3 tools/couverture/verifier_couverture.py

      - name: Rapports en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 7

  import-donnees:
    name: import-donnees
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Tests des scripts d'import
        run: python3 -m unittest discover -s tools/import/tests -v
