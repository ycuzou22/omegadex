name: diag-69
on:
  push:
    branches: [diag-69]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v5
      - name: Build
        run: |
          set -o pipefail
          ./gradlew build lint ktlintCheck detekt test --continue 2>&1 | tee build.log || {
            { grep -E "^e: |FAILED|rror|Lint found|failed|\.kt:[0-9]+|What went wrong|Exception|expected|but was" build.log | head -60; } | while IFS= read -r l; do echo "::error::$l"; done
            exit 1; }
      - name: Publier le schéma généré
        if: always()
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f app/schemas || true; git commit -m "schemas" || true
          git push origin HEAD:diag-69 2>&1 | while IFS= read -r l; do echo "::warning::$l"; done
