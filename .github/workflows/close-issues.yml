name: Fermer les sous-tâches fusionnées

# GitHub ne ferme automatiquement une issue que si la PR est fusionnée dans la
# branche par défaut. Les sous-tâches étant fusionnées dans dev-frontend ou
# dev-backend, ce workflow ferme les issues citées par « Closes #n ».

on:
  pull_request:
    types: [closed]
    branches: [dev-frontend, dev-backend]

permissions:
  issues: write

jobs:
  close:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Fermer les issues référencées
        env:
          GH_TOKEN: ${{ github.token }}
          BODY: ${{ github.event.pull_request.body }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          numbers=$(printf '%s' "$BODY" | grep -Eio '(close[sd]?|fix(e[sd])?|resolve[sd]?) #[0-9]+' | grep -Eo '[0-9]+' | sort -u)
          for n in $numbers; do
            gh issue close "$n" --repo "$REPO" --reason completed --comment "Fermée par la fusion de #$PR."
          done
