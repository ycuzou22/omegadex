name: verif-build
on: push
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v5
      - name: Formatage ktlint
        run: |
          ./gradlew ktlintFormat > fmt.log 2>&1 || { tail -30 fmt.log | while IFS= read -r l; do echo "::warning::$l"; done; }
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A app && git commit -m "format" && echo "::warning::formatage appliqué" || true
      - name: Build
        run: |
          set +e
          ./gradlew build lint ktlintCheck detekt test createDebugUnitTestCoverageReport --continue 2>&1 | tee build.log; st=${PIPESTATUS[0]}; mkdir -p captures; cp build.log captures/; find app/build/reports \( -name '*.txt' -o -name '*.xml' \) -path '*test-results*' -prune -o -name '*.txt' -print | xargs -r cp -t captures/ 2>/dev/null; [ $st -eq 0 ] || {
            mkdir -p captures; cp build.log captures/build.log; find app/build/reports -name '*.txt' -o -name 'lint-results*.txt' | xargs -r cp -t captures/ 2>/dev/null || true
            { grep -E "^e: |rror|\.kt:[0-9]+" build.log | head -40; tail -20 build.log; } | while IFS= read -r l; do echo "::error::$l"; done
            exit 1; }
          grep -E "^w: " build.log | head -30 | while IFS= read -r l; do echo "::warning::$l"; done || true
          mkdir -p captures; grep -E "^w: |warning:" build.log > captures/avertissements.txt || true
      - name: Publier les captures sur la branche
        if: always()
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ls -la captures || echo "::error::pas de dossier captures"
          git add -f captures app/schemas 2>/dev/null; git add -f captures || true; git add app/schemas 2>/dev/null || true; git commit -m "captures" || echo "::error::commit impossible"
          git push origin HEAD:${GITHUB_REF_NAME} 2>&1 | while IFS= read -r l; do echo "::error::$l"; done
