name: Recette

# Recette du MVP sur émulateur (T16.2) : 3 profils d'appareil et mode avion.
# Lancement à la demande (onglet Actions), à chaque pull request qui touche la recette, et avant chaque release.
on:
  workflow_dispatch:
  pull_request:
    branches: [main, dev, dev-backend]
    paths:
      - "tools/recette/**"
      - ".github/workflows/recette.yml"
  push:
    branches: ["recette/**"]

permissions:
  contents: read

concurrency:
  group: recette-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: apk
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - name: APK de debug
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 3

  recette:
    name: recette-${{ matrix.profil }}
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - profil: pixel
            api: 35
            arch: x86_64
            appareil: pixel_6
          - profil: android-8
            api: 26
            arch: x86
            appareil: pixel
          - profil: tablette
            api: 34
            arch: x86_64
            appareil: "Nexus 10"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: apk
      - name: Activer KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Recette sur émulateur
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: ${{ matrix.arch }}
          target: google_apis
          profile: ${{ matrix.appareil }}
          disable-animations: true
          # Clavier matériel déclaré : le clavier virtuel ne s'ouvre pas et ne masque pas l'écran.
          pre-emulator-launch-script: |
            for avd in ~/.android/avd/*.avd; do echo "hw.keyboard=yes" >> "$avd/config.ini"; done
          script: |
            adb install -r app-debug.apk
            python3 tools/recette/recette.py --profil ${{ matrix.profil }} --sortie recette
      - name: Résumé
        if: always()
        run: cat recette/${{ matrix.profil }}/recette.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Captures et rapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recette-${{ matrix.profil }}
          path: recette/${{ matrix.profil }}/
          retention-days: 14

  # Tests qui ont besoin d'un vrai Android : chiffrement SQLCipher et clé dans l'Android Keystore (T06.3).
  tests-instrumentes:
    name: tests-instrumentes
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - name: Activer KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: connectedDebugAndroidTest
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest
      - name: Résultats
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-instrumentes
          path: app/build/outputs/androidTest-results/
          retention-days: 14

  # Branches d'essai recette/** : les captures sont recommitées sur la branche pour être relues sans artefact.
  publier:
    name: publier
    if: always() && github.event_name == 'push'
    needs: recette
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: recette-*
          path: recette
      - name: Commiter les captures sur la branche d'essai
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r -q --cached recette 2>/dev/null || true
          git add -f recette
          git commit -m "captures de recette" || exit 0
          git push origin HEAD:${GITHUB_REF_NAME}
